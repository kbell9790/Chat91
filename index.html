<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat91 - Download</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 420px;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 25px;
            margin-bottom: 20px;
        }

        h1 {
            color: #d4af37;
            font-size: 38px;
            margin: 10px 0;
        }

        p {
            color: #ccc;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .download {
            display: inline-block;
            background: #d4af37;
            color: #000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 35px;
            border-radius: 12px;
        }

        .download:hover {
            background: #f0c94a;
        }

        .version {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="./chat91_icon.png" alt="Chat91 Logo" style="width: 100px; height: 100px; object-fit: contain;">    
            alt="Chat91"
            class="logo"
        >

        <h1>Chat91</h1>

        <p>
            Download the official Chat91 Android app.
        </p>

        <a
            href="app-release.apk"
            class="download"
            download
        >
            Download Chat91
        </a>

        <div class="version">
            Android APK
        </div>

    </div>

</body>
</html>
